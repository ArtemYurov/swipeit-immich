name: Android build

# Triggers:
#  - push to any branch with changes in mobile/** or the workflow file itself
#  - workflow_dispatch for manual runs during debugging
# Per-branch behaviour is controlled by `if: github.ref == 'refs/heads/master'`
# guards on the release/cleanup steps further down.
on:
  push:
    branches: ['**']
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

# Cancels previous runs when several pushes land on the same ref quickly.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

# contents: write is required for softprops/action-gh-release and gh release edit/delete.
permissions:
  contents: write

env:
  # Canonical app slug (mobile/app.json:expo.slug).
  # Used as a prefix for the artifact name and prerelease tag.
  APP_SLUG: immich-swipe

jobs:
  build:
    runs-on: ubuntu-latest
    # Hard cap so a hung Gradle / setup-android does not burn the minute quota.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      # fetch-depth: 0 is required — git rev-list --count HEAD needs full history.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Format: ${slug}-${branch}-${count}-${sha7}
      # Example: immich-swipe-master-127-a360017
      # Used as: prerelease tag, release name, and APK filename.
      - name: Compute version
        id: version
        working-directory: .
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          COUNT=$(git rev-list --count HEAD)
          SHORT=$(git rev-parse --short=7 HEAD)
          VERSION="${{ env.APP_SLUG }}-${BRANCH}-${COUNT}-${SHORT}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Computed version: $VERSION"
          echo "  branch: $BRANCH"
          echo "  count:  $COUNT"
          echo "  sha7:   $SHORT"

      # Stable debug keystore comes from a repo secret so APK signature stays
      # constant across runs. Without this, every build gets a fresh
      # ~/.android/debug.keystore on the runner and on-device updates fail
      # with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
      # Single-quoted heredoc prevents shell expansion so the printed
      # commands are valid for copy-paste.
      - name: Verify Android signing secret
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            cat <<'EOF'

          ❌ Missing required secret: ANDROID_DEBUG_KEYSTORE_BASE64

          One-time setup (locally):

            keytool -genkey -v -keystore stable-debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            gh secret set ANDROID_DEBUG_KEYSTORE_BASE64 \
              --body "$(base64 -i stable-debug.keystore)"
            rm stable-debug.keystore

          Then re-run this workflow.

          EOF
            exit 1
          fi
          echo "✅ Signing secret present"

      # Gradle picks up ~/.android/debug.keystore by convention — no
      # build.gradle changes are needed (which is critical because
      # `expo prebuild --clean` regenerates android/ on every run).
      - name: Restore stable debug keystore
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          echo "🔑 Keystore restored at ~/.android/debug.keystore"
          ls -la ~/.android/debug.keystore

      # Node 20 matches client/Dockerfile (node:20-alpine).
      # npm cache is keyed to mobile/package-lock.json.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # JDK 17 is the current standard for AGP 8.x / RN 0.81.
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Installs Android SDK Command-line Tools.
      # gradlew pulls the specific platform/build-tools via sdkmanager later.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # working-directory defaults to mobile/, so npm ci reads mobile/package.json.
      - name: Install mobile deps
        run: |
          echo "📦 Installing mobile dependencies (npm ci)"
          npm ci
          echo "✅ Dependencies installed"

      # Generates mobile/android/ on the fly (managed -> bare workflow).
      # --no-install: dependencies are already installed by the previous step.
      # --clean: ensure a fresh android/ folder on every run.
      - name: Expo prebuild
        run: |
          echo "🏗  Running expo prebuild --platform android --no-install --clean"
          npx expo prebuild --platform android --no-install --clean
          echo "✅ Prebuild complete. android/ generated."
          ls -la android/ | head -20

      # JS must be bundled into the APK explicitly because assembleDebug
      # otherwise expects Metro at localhost:8081.
      # --dev=false is critical: without it, expo export:embed produces a
      # bundle with __DEV__=true that immediately crashes in embedded
      # runtime with "Cannot create devtools websocket connections in
      # embedded environments" — JS never finishes loading, splash hangs.
      - name: Bundle JS into APK
        run: |
          echo "📦 Bundling JS into production-mode bundle (__DEV__=false)"
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res
          npx expo export:embed \
            --platform android \
            --dev false \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/
          echo "✅ JS bundle written to android/app/src/main/assets/index.android.bundle"
          ls -la android/app/src/main/assets/

      # assembleDebug produces a debug-signed APK using the stable keystore
      # restored above (~/.android/debug.keystore). The bundled JS from the
      # previous step is included automatically because it lives under
      # android/app/src/main/assets/.
      # --no-daemon: pointless on a one-shot CI runner.
      # --stacktrace: surface root cause immediately on failure.
      - name: Gradle assembleDebug
        working-directory: mobile/android
        run: |
          echo "🔨 Starting Gradle build (assembleDebug)"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "✅ Gradle build complete"
          echo "📂 APK outputs:"
          ls -la app/build/outputs/apk/debug/

      # Rename app-debug.apk -> ${VERSION}.apk so the artifact attached to the
      # GitHub Release matches the requested naming scheme.
      # apk_path is repo-relative (prefixed with mobile/) for softprops:files.
      - name: Rename APK
        id: apk
        run: |
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          DST_NAME="${{ steps.version.outputs.version }}.apk"
          DST="android/app/build/outputs/apk/debug/${DST_NAME}"
          echo "📝 Renaming APK"
          echo "  source: $SRC"
          echo "  target: $DST"
          mv "$SRC" "$DST"
          echo "apk_path=mobile/${DST}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${DST_NAME}" >> "$GITHUB_OUTPUT"
          ls -la "$DST"

      # Upload APK as a workflow artifact for every branch (master + features).
      # Lives 14 days in the run's Artifacts panel; downloadable by anyone with
      # repo read access. Acts as a fallback if the release step fails on master.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.version }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 14
          if-no-files-found: error

      # Creates a draft prerelease so the next step can inspect / amend it
      # before flipping to published. tag_name is also created as a git tag.
      # Master only — feature branches stop at the artifact upload above.
      - name: Create draft prerelease
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Prerelease ${{ steps.version.outputs.version }}"
          draft: true
          prerelease: true
          files: ${{ steps.apk.outputs.apk_path }}

      # gh CLI is preinstalled on ubuntu-latest. GH_TOKEN is required for auth.
      - name: Publish prerelease
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "🚀 Publishing prerelease: $VERSION"
          gh release edit "$VERSION" --draft=false
          URL=$(gh release view "$VERSION" --json url --jq '.url')
          echo "✅ Published: $URL"

      # Keep only the most recent prerelease; delete older ones (and their tags).
      # Filter by APP_SLUG prefix so we never touch prereleases owned by other
      # workflows / manual releases in this repo.
      # continue-on-error: a flaky cleanup must not fail the whole workflow.
      - name: Cleanup old prereleases
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          PREFIX="${{ env.APP_SLUG }}-"
          echo "🧹 Cleaning up old prereleases (prefix: ${PREFIX})..."
          PRERELEASES=$(gh release list \
            --limit 100 \
            --json tagName,isPrerelease,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[] | select(.isPrerelease and (.tagName | startswith(\"${PREFIX}\"))) | .tagName")

          if [ -z "$PRERELEASES" ]; then
            echo "  no matching prereleases found"
            exit 0
          fi

          COUNT=$(echo "$PRERELEASES" | wc -l | tr -d ' ')
          echo "  found $COUNT prerelease(s) with prefix ${PREFIX}"

          # tail -n +2 — skip the newest (the one we just published) and delete the rest.
          echo "$PRERELEASES" | tail -n +2 | while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "  🗑  deleting $TAG"
            gh release delete "$TAG" --yes \
              || echo "    (release delete failed for $TAG)"
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG" \
              || echo "    (tag ref delete failed for $TAG)"
          done
          echo "✅ Cleanup complete"
